# --- DataSource (H2 in-memory, MODE=PostgreSQL for closer SQL-dialect parity with the
#     optional PostgreSQL profile) ---
spring.datasource.url=jdbc:h2:mem:lipokdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 Console ---
# SECURITY: the H2 console (like the rest of this API — see CLAUDE.md/SCHEMA.md) has no
# authentication, and H2 itself has a history of console-related RCE CVEs (e.g. CVE-2021-42392).
# Fine for local development against an in-memory, per-restart-throwaway database; never expose
# port 8080 for an h2-active instance to an untrusted network.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
