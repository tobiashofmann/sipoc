# --- DataSource (MySQL) ---
# DB_HOST defaults to "mysql", matching the docker-compose service name — override it (e.g. to
# "localhost") when pointing at a MySQL instance run outside Docker Compose.
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:lipokdb}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:sipoc}
spring.datasource.password=${DB_PASSWORD:sipoc}

# --- H2 Console (not applicable to this profile) ---
spring.h2.console.enabled=false
