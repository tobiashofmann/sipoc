# --- DataSource (PostgreSQL) ---
# DB_HOST defaults to "postgresql", matching the docker-compose service name — override it (e.g.
# to "localhost") when pointing at a PostgreSQL instance run outside Docker Compose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgresql}:${DB_PORT:5432}/${DB_NAME:lipokdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:sipoc}
spring.datasource.password=${DB_PASSWORD:sipoc}

# --- H2 Console (not applicable to this profile) ---
spring.h2.console.enabled=false
