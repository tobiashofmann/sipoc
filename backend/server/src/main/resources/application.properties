spring.application.name=server

# --- Database selection ---
# Default active profile; picks up application-<profile>.properties (h2/mysql/postgresql in
# src/main/resources — see the root README.md's "Backend" section for how to switch). This
# default is overridden — not merged with — whichever profile is set via the
# SPRING_PROFILES_ACTIVE env var, a --spring.profiles.active= CLI flag, or
# -Dspring-boot.run.profiles=<profile> with the Maven plugin, e.g.:
#   SPRING_PROFILES_ACTIVE=postgresql ./mvnw spring-boot:run
spring.profiles.active=h2

# --- JPA / Hibernate (shared by every db profile) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: damit Open Session in View nicht “heimlich” Queries im Controller triggert
# (für APIs oft besser aus)
spring.jpa.open-in-view=false

# --- Logging (optional, teils sehr chatty) ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
