<div class="p-6 lg:p-5 max-w-5xl mx-auto">
  <ui5-hero-banner [headerText]="'home.sipocsCardTitle' | translate" class="block mb-6 lg:mb-5">
    <div slot="actions" class="bg-white rounded-lg px-4 py-2 lg:px-3 lg:py-1.5">
      <ui5-link href="https://www.itsfullofstars.de/" target="_blank" icon="globe">{{ 'home.starsLink' | translate }}</ui5-link>
    </div>

    <div class="flex flex-col gap-4 lg:gap-3">
      <ui5-text class="text-white block w-full">
        {{ 'home.heroDescription' | translate }}
      </ui5-text>

      <div class="flex gap-4 lg:gap-3">
        <ui5-card class="flex-1">
          <ui5-card-header
            slot="header"
            [titleText]="'home.sipocsCardTitle' | translate"
            [subtitleText]="'home.sipocsCardSubtitle' | translate"
          ></ui5-card-header>
          <div class="p-4 lg:p-3 text-2xl font-bold">{{ lipokCount() ?? '–' }}</div>
        </ui5-card>
        <ui5-card class="flex-1">
          <ui5-card-header
            slot="header"
            [titleText]="'home.documentsCardTitle' | translate"
            [subtitleText]="'home.documentsCardSubtitle' | translate"
          ></ui5-card-header>
          <div class="p-4 lg:p-3 text-2xl font-bold">{{ documentCount() ?? '–' }}</div>
        </ui5-card>
      </div>
    </div>
  </ui5-hero-banner>

  <ui5-title level="H2" class="block mb-2 lg:mb-1">{{ 'home.title' | translate }}</ui5-title>
  <ui5-label class="block text-gray-500 mb-6 lg:mb-5">{{ 'home.subtitle' | translate }}</ui5-label>

  <ui5-product-switch>
    <ui5-product-switch-item
      icon="process"
      [titleText]="'home.sipocsTileTitle' | translate"
      [subtitleText]="'home.sipocsTileSubtitle' | translate"
      (click)="openSipocs()"
    ></ui5-product-switch-item>
    <ui5-product-switch-item
      icon="customer-and-supplier"
      [titleText]="'home.businessPartnersTileTitle' | translate"
      [subtitleText]="'home.businessPartnersTileSubtitle' | translate"
      (click)="openBusinessPartners()"
    ></ui5-product-switch-item>
    <ui5-product-switch-item
      icon="org-chart"
      [titleText]="'home.gosTileTitle' | translate"
      [subtitleText]="'home.gosTileSubtitle' | translate"
      (click)="openGos()"
    ></ui5-product-switch-item>
  </ui5-product-switch>
</div>
